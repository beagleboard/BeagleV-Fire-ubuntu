variables:
  TRANSFER_METER_FREQUENCY: "5s"
  CI_USE_RISCV_BUILDER: "disabled"

before_script:
  - export PATH=/usr/lib/ccache:$PATH
  - export CCACHE_DIR=/dev/shm/my-ccache-in-memory
  - export DEBEMAIL="$GITLAB_USER_EMAIL"
  - export DEBFULLNAME="$GITLAB_USER_NAME"
  - df -h /dev/shm
  - git config --global user.email "$GITLAB_USER_EMAIL"
  - git config --global user.name "$GITLAB_USER_NAME"
  - git config --global advice.detachedHead false
  - touch .gitlab-runner

build-v6.12-debian-13-riscv64:
  image: registry.gfnd.rcn-ee.org:5000/ci/beagle-devscripts-kernel-debian-13-amd64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  cache:
    key: "$CI_PROJECT_NAME-v6.12-debian-13-riscv64"
    paths:
      - mirror/x86_64-gcc-*-linux.tar.xz
      - ccache.tar.zst
  tags:
    - docker-amd64
  stage: build
  script:
    - ./tools/ci-setup-ccache.sh
    - ./01_git_sync.sh
    - ./02_build_hss.sh
    - ./03_build_u-boot.sh
    - ./04_build_linux.sh
    - ./tools/ci-cleanup-ccache.sh
    - ./05_generate_payload.bin.sh
    - ./06_generate_debian_console_root.sh
    - ./07_create_sdcard_img.sh
    - tree -s deploy/
    - cp -v deploy/images/*.img.xz ./deploy/
    - cp -v deploy/images/*.bmap ./deploy/
    - cp -v deploy/images/*.img.xz.yml.txt ./deploy/
    - cp -v deploy/input/beaglev_fire.itb ./deploy/
  artifacts:
    when: on_success
    expire_in: 2 week
    name: "$CI_PROJECT_NAME-v6.12-debian-13-riscv64-$CI_JOB_ID"
    paths:
      - "deploy/*modules.tar.gz"
      - "deploy/beaglev_fire.itb"
      - "deploy/*.img.xz"
      - "deploy/*.bmap"
      - "deploy/*.img.xz.yml.txt"
      - "deploy/readme.md"
  rules:
    - if: '$CI_USE_RISCV_BUILDER == "disabled"'
      when: on_success

build-debian-13-riscv64:
  image: registry.gfnd.rcn-ee.org:5000/ci/beagle-devscripts-kernel-debian-13-amd64:latest
#  image: registry.gfnd.rcn-ee.org:5000/ci/beagle-devscripts-kernel-debian-13-riscv64:latest
  # https://openbeagle.org/beagleboard/ci-docker-images
  cache:
    key: "$CI_PROJECT_NAME-debian-13-riscv64"
    paths:
      - ccache.tar.zst
  tags:
    - docker-amd64
  stage: build
  script:
    - touch .ci-debian-gcc
    - ./tools/ci-setup-ccache.sh
    - ./01_git_sync.sh
    - ./02_build_hss.sh
    - ./03_build_u-boot.sh
    - ./04_build_linux.sh
    - ./tools/ci-cleanup-ccache.sh
    - ./05_generate_payload.bin.sh
    - ./06_generate_debian_console_root.sh
    - ./07_create_sdcard_img.sh
    - tree -s deploy/
    - cp -v deploy/images/*.img.xz ./deploy/
    - cp -v deploy/images/*.bmap ./deploy/
    - cp -v deploy/images/*.img.xz.yml.txt ./deploy/
  artifacts:
    when: on_success
    expire_in: 2 week
    name: "$CI_PROJECT_NAME-debian-13-riscv64-$CI_JOB_ID"
    paths:
      - "deploy/*.img.xz"
      - "deploy/*.bmap"
      - "deploy/*.img.xz.yml.txt"
      - "deploy/readme.md"
  rules:
    - if: '$CI_USE_RISCV_BUILDER == "enable"'
      when: on_success
